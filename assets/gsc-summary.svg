<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Google Search Console 前後期結果摘要</title>
  <desc id="desc">後期 GSC 曝光與點擊增加，但 CTR 與平均排名未同步改善。</desc>
  <rect width="920" height="430" rx="24" fill="#f7f8fb"/>
  <text x="48" y="58" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#1f2937">Google Search Console：可見度擴張，但點擊效率仍要追</text>
  <text x="48" y="92" font-family="system-ui, sans-serif" font-size="16" fill="#6b7280">前期 2026/5/1–6/28（59 天）｜後期 2026/6/30–8/20（52 天）</text>

  <rect x="48" y="126" width="194" height="118" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="68" y="158" font-family="system-ui, sans-serif" font-size="15" fill="#6b7280">GSC 曝光</text>
  <text x="68" y="198" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#111827">16.1K → 21.7K</text>
  <text x="68" y="226" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563eb">總量 +34.8%</text>

  <rect x="258" y="126" width="194" height="118" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="278" y="158" font-family="system-ui, sans-serif" font-size="15" fill="#6b7280">GSC 點擊</text>
  <text x="278" y="198" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#111827">299 → 346</text>
  <text x="278" y="226" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563eb">總量 +15.7%</text>

  <rect x="468" y="126" width="194" height="118" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="488" y="158" font-family="system-ui, sans-serif" font-size="15" fill="#6b7280">日均曝光</text>
  <text x="488" y="198" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#111827">272.9 → 417.3</text>
  <text x="488" y="226" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563eb">約 +52.9%</text>

  <rect x="678" y="126" width="194" height="118" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="698" y="158" font-family="system-ui, sans-serif" font-size="15" fill="#6b7280">AI 摘要曝光</text>
  <text x="698" y="198" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#111827">4,428 → 5,736</text>
  <text x="698" y="226" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#7c3aed">總量 +29.5%</text>

  <rect x="48" y="270" width="824" height="104" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="70" y="305" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#374151">同時保留不利結果</text>
  <text x="70" y="338" font-family="system-ui, sans-serif" font-size="19" fill="#111827">CTR：1.9% → 1.6%　｜　平均排名：6.3 → 8.8</text>
  <text x="70" y="362" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">目前只能說搜尋可見度擴張；需要搜尋詞與頁面層級資料，才能判斷新增曝光是否來自較低順位的新 query / page。</text>

  <text x="48" y="410" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">注意：前後期不是 controlled experiment，不能將變化直接歸因到單一 SEO / AIO 修改。</text>
</svg>
